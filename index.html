<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>짝사랑은 교칙 위반인가요? — DOHUN SIDE</title>
<style>
:root{color-scheme:dark;--bg:#17151b;--panel:#211e27;--line:#403945;--ink:#f5edf2;--muted:#b8a9b7;--accent:#e7a5c0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.85}header{position:sticky;top:0;z-index:3;background:#17151bf2;border-bottom:1px solid var(--line);padding:15px max(20px,calc((100vw - 760px)/2))}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px}.top strong{font-weight:700}.muted{color:var(--muted)}.meter{height:9px;border-radius:100px;background:#413541;margin-top:10px;overflow:hidden}.fill{height:100%;background:var(--accent);transition:width .35s ease}main{max-width:760px;margin:0 auto;padding:58px 22px 90px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:700}h1{font-size:clamp(27px,6vw,42px);line-height:1.4;margin:13px 0 22px;word-break:keep-all}h2{font-size:24px;line-height:1.5;margin:10px 0 26px}.story{white-space:pre-line;font-size:17px;line-height:2.15;word-break:keep-all;margin-bottom:38px}.choices{display:grid;gap:12px}.choice{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:18px;font:inherit;cursor:pointer;transition:background .2s,border-color .2s}.choice:hover,.choice:focus-visible{border-color:var(--accent);background:#312733;outline:none}.result{margin:0 0 24px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;color:var(--accent);font-weight:700}.result.neg{color:#d5a2a2}.delta{font-size:13px;font-weight:800;white-space:nowrap;color:var(--accent)}.delta.neg{color:#d5a2a2}.btn{border:1px solid var(--accent);border-radius:10px;padding:12px 19px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}.btn:hover{background:#352935}.footer{margin-top:45px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.note{font-size:13px;color:var(--muted)}.ending{border-top:1px solid var(--line);padding-top:30px}.hidden{display:none}@media(max-width:480px){main{padding-top:40px}.story{font-size:16px}.choice{padding:15px}}
</style>
</head>
<body>
<header><div class="top"><strong>지훈 호감도</strong><span id="score" aria-live="polite">50%</span></div><div class="meter" role="progressbar" aria-label="지훈 호감도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" id="meter"><div class="fill" id="fill" style="width:50%"></div></div></header>
<main><div class="eyebrow" id="chapter">INTERACTIVE NOVEL · DOHUN SIDE</div><h1 id="title">짝사랑은 교칙 위반인가요?</h1><div class="result hidden" id="result" aria-live="polite"></div><div class="story" id="story"></div><div class="choices" id="choices"></div><div class="footer"><span class="note" id="status">선택에 따라 이야기가 달라집니다.</span><button class="btn" id="reset">처음부터</button></div></main>
<script>
const KEY='dohun-side-save-v1';
const scenes=[
{title:'자꾸 마주치는 애',story:`한지훈. 이름을 알게 된 건 얼마 되지 않았다.\n\n연습실 문 앞에서, 복도 끝에서, 매점 앞에서. 이상하게 자꾸 눈이 마주치는 후배.\n\n오늘도 문틈으로 얼굴만 빼꼼 내민다.\n\n“선배, 혹시 지금 바빠요?”\n\n바쁘냐고 물으면서도 돌아갈 생각은 없어 보인다. 나는 기타를 내려놓았다.`,choices:[['“너 보려고 안 바쁜 척하는 중.”',10],['“잠깐 쉬는 중인데, 왜?”',5],['“바빠. 다음에 와.”',-10]]},
{title:'형이라고 불러',story:`지훈은 늘 나를 ‘선배’라고 부른다.\n\n다른 애들은 다 도훈이 형이라고 하는데. 나도 모르게 그 말이 입 밖으로 나왔다.\n\n“너는 왜 맨날 선배래. 형이라고 해.”\n\n지훈의 귀 끝이 붉어진다.\n\n“그, 그래도 돼요?”`,choices:[['“당연하지. 너한텐 허락해 줄게.”',10],['“편한 대로 불러.”',5],['“아, 됐다. 그냥 선배 해.”',-10]]},
{title:'괜히 기다린 오후',story:`연습이 끝났는데도 발이 떨어지지 않았다.\n\n늘 이 시간이면 지훈이 복도를 지나갔다.\n\n친구가 묻는다. “누구 기다려?”\n\n나는 대답하지 못한다. 그때 계단에서 지훈의 발소리가 들린다.`,choices:[['먼저 다가가 같이 가자고 한다.',10],['눈이 마주치면 손을 흔든다.',5],['못 본 척 다른 길로 간다.',-10]]},
{title:'너무 쉬운 장난',story:`“형은 누구한테나 그렇게 말해요?”\n\n지훈이 웃으면서 묻는다. 웃고 있지만 눈은 조금 불안해 보인다.\n\n내가 아무렇지 않게 던진 말들이, 이 애한테는 가벼운 농담이 아닐지도 모른다.`,choices:[['“아니. 너라서 그러는 거야.”',10],['“왜, 신경 쓰여?” 하고 웃는다.',5],['“다 똑같지, 뭐.”',-10]]},
{title:'비어 있는 자리',story:`며칠째 지훈이 보이지 않는다.\n\n연습실 문도 조용하고, 휴대폰에도 알림이 없다.\n\n없으면 편할 줄 알았는데 자꾸 문 쪽을 보게 된다.\n\n내가 기다리고 있었던 건가.`,choices:[['먼저 연락해 무슨 일인지 묻는다.',10],['우연을 가장해 댄스부실에 가 본다.',5],['찾아오겠지 싶어 그대로 둔다.',-10]]},
{title:'김도훈 형',story:`복도에서 마주친 지훈이 고개를 숙인다.\n\n“안녕하세요, 김도훈 형.”\n\n이상하다. 이름 앞에 성 하나가 붙었을 뿐인데, 멀리 밀려난 것 같다.\n\n“야.” 나도 모르게 불렀다.`,choices:[['“성 붙이지 마. 나한테 왜 그래?”라고 진심을 묻는다.',10],['“도훈이 형이 더 좋은데.”라고 말한다.',5],['“그래, 한지훈.” 하고 똑같이 거리를 둔다.',-10]]},
{title:'말하지 않은 마음',story:`지훈이 발걸음을 멈춘다.\n\n“형은 그냥 장난이었잖아요.”\n\n처음으로 그 애가 나를 똑바로 바라본다.\n\n나는 이제야 안다. 내가 장난이라고 부른 건 사실 겁이었다.`,choices:[['“장난 아니었어. 내가 늦게 알았어.”',10],['“우리 다시 천천히 얘기하면 안 될까?”',5],['“그렇게 생각하면 어쩔 수 없지.”',-10]]},
{title:'돌아가는 길',story:`하교 시간이 한참 지났다.\n\n지훈과 나란히 걷는데, 예전처럼 쉽게 말을 걸 수가 없다.\n\n횡단보도 앞에서 지훈이 말한다.\n\n“형이랑 있으면 자꾸 기대하게 돼요.”`,choices:[['“기대해도 돼. 이번엔 내가 먼저 갈게.”',10],['“그럼 조금씩 맞춰 보자.”',5],['“기대하지 않는 게 좋을 것 같아.”',-10]]},
{title:'내가 선택한 사람',story:`학교 축제 날. 사람들 사이에서 지훈을 찾았다.\n\n내가 무대에 서 있는 동안에도 그 애가 보고 있을지 궁금했다.\n\n끝나자마자 지훈에게 다가간다.\n\n이제는 모른 척하고 싶지 않다.`,choices:[['사람들 앞에서도 지훈에게 솔직히 마음을 전한다.',10],['조용한 곳에서 둘이 이야기하자고 한다.',5],['끝내 아무 말도 하지 않는다.',-10]]},
{title:'마지막 한 걸음',story:`지훈은 내 앞에 서 있다.\n\n“형, 나한테 하고 싶은 말 있어요?”\n\n그 애의 표정은 조심스럽다.\n\n나는 지금까지 수없이 쉬운 말만 골랐다.\n\n이번엔 어떤 말을 해야 할까.`,choices:[['“지훈아, 좋아해. 이번엔 내가 너를 좋아해.”',10],['“네 옆에 계속 있어도 될까?”',5],['“아니. 별말 없어.”',-10]]}
];
const endings={happy:{name:'HAPPY ENDING · 교칙 위반, 둘이서',body:`“지훈아, 좋아해.”\n\n말이 끝나기도 전에 지훈이 웃었다. 울 것 같은 얼굴로.\n\n“그 말, 진짜죠?”\n\n“응. 이제 장난 안 쳐.”\n\n지훈이 내 손을 잡는다. 내가 먼저 손가락을 얽었다.\n\n누가 먼저 좋아했는지는 이제 중요하지 않다.\n\n우리는 같은 방향으로 걷기 시작했다.`},normal:{name:'NORMAL ENDING · 아직은 우리 사이',body:`지훈은 한참 생각하다가 고개를 끄덕였다.\n\n“조금만 천천히 가요, 형.”\n\n나는 웃었다. 이번에는 서두르지 않기로 했다.\n\n아직 연인은 아니다. 하지만 하교 길에 서로를 기다리는 사람은 되었다.\n\n우리 이야기는 아직 끝나지 않았다.`},bad1:{name:'BAD ENDING 1 · 닿지 못한 말',body:`“미안해요, 형.”\n\n지훈은 끝내 웃지 않았다.\n\n좋아한다고 말하기에는 너무 늦었고, 아무렇지 않은 척하기에는 이미 많은 걸 잃었다.\n\n복도에서 다시 마주치면 우리는 인사만 한다.\n\n김도훈 형. 그 호칭이 끝내 바뀌지 않았다.`},bad2:{name:'BAD ENDING 2 · 모르는 사람처럼',body:`지훈은 더는 나를 찾아오지 않는다.\n\n내 연락에는 답이 없고, 복도에서 눈이 마주쳐도 조용히 지나간다.\n\n“도훈아, 쟤랑 친하지 않았어?”\n\n나는 대답하지 못했다.\n\n이제 지훈에게 나는 선배도, 형도 아니다.\n\n그저 지나가는 사람이다.`}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Number.isInteger(state.step)||state.step<0||state.step>scenes.length||!Number.isFinite(state.score))state={step:-1,score:50};
const el=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function render(){state.score=Math.max(0,Math.min(100,state.score));el('score').textContent=state.score+'%';el('fill').style.width=state.score+'%';el('meter').setAttribute('aria-valuenow',state.score);el('choices').replaceChildren();const result=el('result');if(state.lastDelta!=null&&state.step>=0){const d=state.lastDelta;result.textContent=d>0?'지훈 호감도 +'+d+'점 획득!':d<0?'지훈 호감도 '+d+'점 감소':'지훈 호감도 변동 없음';result.className='result'+(d<0?' neg':'')}else{result.className='result hidden';result.textContent=''}if(state.step===-1){el('chapter').textContent='INTERACTIVE NOVEL · DOHUN SIDE';el('title').textContent='짝사랑은 교칙 위반인가요?';el('story').textContent='나는 한지훈을 귀여운 후배라고 생각했다.\n\n그 애가 내 곁에서 멀어지기 전까지는.\n\n도훈의 시점으로 다시 시작하는 이야기. 매 장면 3개의 선택지 중 하나를 골라 지훈의 마음을 마주하세요.\n\n호감도 50%에서 시작합니다. 100%는 해피 엔딩, 50~99%는 노멀 엔딩, 25~49%는 배드 엔딩 1, 0~24%는 배드 엔딩 2입니다.';addButton('이야기 시작하기','',()=>{state.step=0;save();render()});el('status').textContent='10개의 장면 · 총 4개의 엔딩';}else if(state.step<scenes.length){const s=scenes[state.step];el('chapter').textContent=`CHAPTER ${String(state.step+1).padStart(2,'0')} / ${scenes.length}`;el('title').textContent=s.title;el('story').textContent=s.story;s.choices.forEach(([label,delta])=>addButton(label,'',()=>{state.lastDelta=delta;state.score=Math.max(0,Math.min(100,state.score+delta));state.step++;save();render();window.scrollTo({top:0,behavior:'smooth'})}));el('status').textContent='선택 결과는 자동 저장됩니다.';}else{const ending=state.score===100?endings.happy:state.score>=50?endings.normal:state.score>=25?endings.bad1:endings.bad2;el('chapter').textContent='THE END';el('title').textContent=ending.name;el('story').textContent=ending.body;addButton('다시 플레이하기','',reset);el('status').textContent='최종 호감도 '+state.score+'%';}}
function addButton(label,delta,fn){const b=document.createElement('button');b.className='choice';const t=document.createElement('span');t.textContent=label;b.append(t);if(delta){const d=document.createElement('span');d.className='delta'+(delta.startsWith('-')?' neg':'');d.textContent=delta+'점';b.append(d)}b.addEventListener('click',fn);el('choices').append(b)}function reset(){if(!confirm('진행 상황을 지우고 처음부터 시작할까요?'))return;state={step:-1,score:50,lastDelta:null};save();render();window.scrollTo({top:0,behavior:'smooth'})}el('reset').addEventListener('click',reset);render();
</script>
</body></html>
